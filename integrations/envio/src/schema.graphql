// envio/schema.graphql
type MedicalCertificate @entity {
  id: ID!
  tokenId: BigInt!
  recipient: Bytes!
  diagnosis: String!
  accuracy: BigInt!
  patientId: String!
  conditions: [String!]!
  timestamp: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
}

type GasSponsorship @entity {
  id: ID!
  user: Bytes!
  amount: BigInt!
  reason: String!
  transactionHash: Bytes!
  blockNumber: BigInt!
}

type AuthorizedContract @entity {
  id: ID!
  contractAddress: Bytes!
  authorized: Boolean!
  transactionHash: Bytes!
  blockNumber: BigInt!
}

type AggregatedData @entity {
  id: ID!
  totalCertificates: BigInt!
  totalGasSponsored: BigInt!
  totalAuthorizedContracts: BigInt!
  lastUpdated: BigInt!
}